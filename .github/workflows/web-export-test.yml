# Test-only workflow: exports the current Godot project to a downloadable Web artifact.
name: Web export test

on:
  workflow_dispatch:
  push:
    branches:
      - test-web-export

jobs:
  export-web:
    name: Export Godot Web build
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.6.stable ~/.local/share/godot/export_templates/4.6.stable

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" "$(pwd)/build/web/index.html"

      - name: Show exported files
        run: find build/web -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
